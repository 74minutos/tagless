name = "tagless-cdn"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Custom domain: Cloudflare creates the DNS record automatically
# (requires the tagless.foo zone on the same account).
routes = [
  { pattern = "cdn.tagless.foo", custom_domain = true }
]

[[kv_namespaces]]
binding = "BUNDLES"
id = "REPLACE_AT_DEPLOY" # npx wrangler kv namespace create BUNDLES
