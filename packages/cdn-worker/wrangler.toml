name = "tagless-cdn"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Custom domain: Cloudflare creates the DNS record automatically
# (requires the tagless.foo zone on the same account).
routes = [
  { pattern = "cdn.tagless.foo", custom_domain = true },
  { pattern = "tagless.foo", custom_domain = true }
]

[[kv_namespaces]]
binding = "BUNDLES"
id = "f89ac9e26033420a9178cd4dd07199d0"

# hosted-install telemetry: bundle serves per site (server-side, no visitor
# data). Query via the CF Analytics Engine SQL API.
[[analytics_engine_datasets]]
binding = "tagless_installs"
dataset = "tagless_installs"
