# GA4 — vendor spec contract
id: ga4
version: 1
name: Google Analytics 4
docs: https://developers.google.com/analytics/devguides/collection/protocol/ga4

consent: analytics

placements: [client, server]
modes:
  direct:
    placement: client
    transport: POST https://www.google-analytics.com/g/collect
    note: g/collect web protocol directly; no gtag.js
  sdk:
    placement: client
    note: loads gtag.js — only when Google Signals / vendor-side features are required
  mp:
    placement: server
    transport: POST https://www.google-analytics.com/mp/collect
    note: Measurement Protocol; requires api_secret

config:
  measurement_id: { type: string, required: true, pattern: "^G-" }

params:
  # events pass through with their own names (GA4 recommended-event vocabulary)
  string_fields: "ep.<key>"
  numeric_fields: "epn.<key>"

identity:
  # gtag parity — the direct-mode generator implements all of these
  cid: standard _ga cookie (GA1.1.<random>.<ts>), read AND written in the same
    format so migrated sites keep user continuity with historical GA4 data
  session: sid/sct/seg with 30-min timeout, _fv on first visit, _ss on session
    start — required for GA4 to report sessions at all
  context: ul (language), sr (screen resolution), _p (page-load id)
